# bochs-drm (QEMU -vga std) through modesetting, CPU-only: glamor would pull in
# llvmpipe, which is far too slow under emulation.
Section "Device"
    Identifier "card0"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
    Option     "ShadowFB"    "false"
    Option     "PageFlip"    "false"
EndSection

Section "Screen"
    Identifier   "screen0"
    Device       "card0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600" "1024x768" "1280x720" "640x480"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "AutoAddGPU"  "false"
EndSection
