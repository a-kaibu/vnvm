[package]
name = "vnx86"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "i386 user-mode CPU core (interpreter, later x86->wasm JIT) for running Windows code under a wasm-built Wine"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["no_std", "decoder", "instr_info", "fast_fmt"] }
libm = "0.2"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dev-dependencies]
libc = "0.2"
iced-x86 = { version = "1.21", default-features = false, features = ["no_std", "decoder", "instr_info", "encoder", "code_asm", "nasm"] }
