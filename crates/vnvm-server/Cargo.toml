[package]
name = "vnvm-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serves the vnvm web app, disk chunks and game library"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
